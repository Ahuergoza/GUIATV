<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Guía TV</title>

<style>

body{
    font-family:Arial,sans-serif;
    background:#f4f4f9;
    margin:20px;
    color:#333;
}

#status{
    padding:10px;
    margin-bottom:20px;
    border-radius:5px;
    font-weight:bold;
}

.loading{
    background:#e2e3e5;
    color:#383d41;
}

.success{
    background:#d4edda;
    color:#155724;
}

.error{
    background:#f8d7da;
    color:#721c24;
}

.channel-card{
    background:white;
    border-radius:8px;
    padding:15px;
    margin-bottom:15px;
    box-shadow:0 2px 4px rgba(0,0,0,.1);
}

.channel-header{
    display:flex;
    align-items:center;
    gap:15px;
    border-bottom:1px solid #ddd;
    padding-bottom:10px;
    margin-bottom:10px;
}

.channel-header img{
    max-width:80px;
    max-height:40px;
}

.programme{
    background:#f8f9fa;
    border-left:4px solid #007bff;
    padding:8px;
    margin:5px 0;
}

.time{
    color:#666;
    font-size:0.9em;
}

</style>
</head>

<body>

<h1>Guía TV</h1>

<div id="status" class="loading">
Cargando EPG...
</div>

<div id="epg-container"></div>

<script>

// ==========================================
// XMLTV DE DOBLEM
// ==========================================

const EPG_URL =
"https://raw.githubusercontent.com/davidmuma/EPG_dobleM/master/guiatv.xml?t=" + Date.now();


// ==========================================
// CANALES A MOSTRAR
// ==========================================

const CANALES_VISIBLES = [

"LA 1",
"LA 2",
"ANTENA 3",
"CUATRO",
"TELECINCO",
"LASEXTA"

];


// ==========================================

function formatearHora(fechaXML){

    if(!fechaXML) return "";

    const hora = fechaXML.substring(8,10);
    const minuto = fechaXML.substring(10,12);

    return hora + ":" + minuto;
}


// ==========================================

async function cargarEPG(){

    const status =
        document.getElementById("status");

    try{

        status.className = "loading";
        status.textContent =
            "Descargando guía...";

        console.log("Intentando cargar:");
        console.log(EPG_URL);

        const response =
            await fetch(EPG_URL);

        console.log("HTTP:",response.status);

        if(!response.ok){

            throw new Error(
                "HTTP " + response.status
            );

        }

        const xmlText =
            await response.text();

        if(xmlText.length < 100){

            throw new Error(
                "XML vacío"
            );

        }

        const parser =
            new DOMParser();

        const xml =
            parser.parseFromString(
                xmlText,
                "text/xml"
            );

        const errorXML =
            xml.querySelector(
                "parsererror"
            );

        if(errorXML){

            throw new Error(
                "XML inválido"
            );

        }

        renderEPG(xml);

        status.className =
            "success";

        status.textContent =
            "EPG cargada correctamente";

    }
    catch(error){

        console.error(error);

        status.className =
            "error";

        status.textContent =
            "ERROR: " + error.message;
    }

}


// ==========================================

function renderEPG(xml){

    const container =
        document.getElementById(
            "epg-container"
        );

    container.innerHTML = "";

    const channels =
        xml.querySelectorAll(
            "channel"
        );

    channels.forEach(channel=>{

        const id =
            channel.getAttribute(
                "id"
            );

        const nombre =
            channel.querySelector(
                "display-name"
            )?.textContent || id;

        const mostrar =
            CANALES_VISIBLES.some(
                c => nombre
                     .toUpperCase()
                     .includes(
                         c.toUpperCase()
                     )
            );

        if(!mostrar) return;

        const logo =
            channel.querySelector(
                "icon"
            )?.getAttribute(
                "src"
            );

        const programas =
            xml.querySelectorAll(
                `programme[channel="${id}"]`
            );

        const tarjeta =
            document.createElement(
                "div"
            );

        tarjeta.className =
            "channel-card";

        let html = `
        <div class="channel-header">
            ${
                logo
                ? `<img src="${logo}">`
                : ""
            }
            <h2>${nombre}</h2>
        </div>
        `;

        let contador = 0;

        programas.forEach(programa=>{

            if(contador >= 15){
                return;
            }

            const titulo =
                programa.querySelector(
                    "title"
                )?.textContent
                || "Sin título";

            const inicio =
                formatearHora(
                    programa.getAttribute(
                        "start"
                    )
                );

            const fin =
                formatearHora(
                    programa.getAttribute(
                        "stop"
                    )
                );

            html += `
            <div class="programme">
                <strong>
                    ${titulo}
                </strong>
                <div class="time">
                    ${inicio} - ${fin}
                </div>
            </div>
            `;

            contador++;

        });

        tarjeta.innerHTML =
            html;

        container.appendChild(
            tarjeta
        );

    });
}


// ==========================================

document.addEventListener(
    "DOMContentLoaded",
    () => {

        cargarEPG();

        setInterval(
            cargarEPG,
            1800000
        );

    }
);

</script>

</body>
</html>
