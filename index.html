Cargando guía...

<script>

// ======================
// URL XML DobleM
// ======================

const EPG_URL =
"https://raw.githubusercontent.com/davidmuma/EPG_dobleM/main/guide.xml?nocache=" + Date.now();


// ======================
// CANALES A MOSTRAR
// Sustituye por los tuyos
// ======================

const CANALES_VISIBLES = [

"LA 1",
"LA 2",
"ANTENA 3",
"CUATRO",
"TELECINCO",
"LASEXTA"

];


// ======================
// Cargar XML
// ======================

async function cargarEPG(){

    const statusDiv =
        document.getElementById("status");

    try{

        statusDiv.className="loading";
        statusDiv.textContent=
            "Descargando EPG actualizada...";

        const response =
            await fetch(EPG_URL);

        if(!response.ok){
            throw new Error(
                "No se pudo descargar la EPG"
            );
        }

        const xmlText =
            await response.text();

        const parser =
            new DOMParser();

        const xml =
            parser.parseFromString(
                xmlText,
                "text/xml"
            );

        renderEPG(xml);

        statusDiv.className="success";

        statusDiv.textContent=
            "EPG actualizada correctamente - "
            + new Date().toLocaleString();

    }
    catch(error){

        console.error(error);

        statusDiv.className="error";

        statusDiv.textContent=
            "Error: " + error.message;
    }
}


// ======================
// Formatear fecha XMLTV
// ======================

function formatearHora(fechaXML){

    if(!fechaXML) return "";

    const hora =
        fechaXML.substring(8,10);

    const minuto =
        fechaXML.substring(10,12);

    return hora + ":" + minuto;
}

                "display-name"
            )?.textContent || id;
