<script>
// ... (mantén todo tu código anterior de canales, variables y funciones de carga igual) ...

function render(){
const grid = document.getElementById("grid");
grid.innerHTML = "";

const timeline = document.createElement("div");
timeline.className = "timeline";
timeline.innerHTML = '<div class="channelCell">Canal</div>';

for(let h=0; h<24; h++){
timeline.innerHTML += '<div class="hour">' + String(h).padStart(2,"0") + ':00</div>';
}

grid.appendChild(timeline);

const selectedDay = document.getElementById("days").value; // Formato "YYYYMMDD"
const filter = document.getElementById("search").value.toLowerCase();

// Convertir selectedDay a objeto Date (a las 00:00:00)
const year = parseInt(selectedDay.substring(0,4));
const month = parseInt(selectedDay.substring(4,6)) - 1;
const day = parseInt(selectedDay.substring(6,8));
const selectedDateTimestamp = new Date(year, month, day, 0, 0, 0).getTime();

Object.keys(channels)
.sort((a,b)=> channels[a].localeCompare(channels[b]))
.forEach(id=>{

if(CANALES_PERMITIDOS.length > 0 && !CANALES_PERMITIDOS.includes(id)) return;
if(!channels[id].toLowerCase().includes(filter)) return;

const row = document.createElement("div");
row.className = "row";

const channelDiv = document.createElement("div");
channelDiv.className = "channelCell";
channelDiv.textContent = channels[id];

const area = document.createElement("div");
area.className = "programArea";

programmes
.filter(p => {
if (p.channel !== id) return false;

// Parsear fecha y hora XMLTV (YYYYMMDDHHmmss)
const pStartYear = parseInt(p.start.substring(0,4));
const pStartMonth = parseInt(p.start.substring(4,6)) - 1;
const pStartDay = parseInt(p.start.substring(6,8));
const pStartHour = parseInt(p.start.substring(8,10));
const pStartMin = parseInt(p.start.substring(10,12));
const pStartSec = parseInt(p.start.substring(12,14) || 0);

const pStopYear = parseInt(p.stop.substring(0,4));
const pStopMonth = parseInt(p.stop.substring(4,6)) - 1;
const pStopDay = parseInt(p.stop.substring(6,8));
const pStopHour = parseInt(p.stop.substring(8,10));
const pStopMin = parseInt(p.stop.substring(10,12));
const pStopSec = parseInt(p.stop.substring(12,14) || 0);

const startDate = new Date(pStartYear, pStartMonth, pStartDay, pStartHour, pStartMin, pStartSec);
const stopDate = new Date(pStopYear, pStopMonth, pStopDay, pStopHour, pStopMin, pStopSec);

const dayStart = selectedDateTimestamp;
const dayEnd = selectedDateTimestamp + 24 * 60 * 60 * 1000;

// El programa se solapa con el día seleccionado si empieza antes del fin del día y termina después del inicio del día
return startDate < dayEnd && stopDate > dayStart;
})
.forEach(p=>{
const pStartYear = parseInt(p.start.substring(0,4));
const pStartMonth = parseInt(p.start.substring(4,6)) - 1;
const pStartDay = parseInt(p.start.substring(6,8));
const pStartHour = parseInt(p.start.substring(8,10));
const pStartMin = parseInt(p.start.substring(10,12));

const pStopYear = parseInt(p.stop.substring(0,4));
const pStopMonth = parseInt(p.stop.substring(4,6)) - 1;
const pStopDay = parseInt(p.stop.substring(6,8));
const pStopHour = parseInt(p.stop.substring(8,10));
const pStopMin = parseInt(p.stop.substring(10,12));

const startDate = new Date(pStartYear, pStartMonth, pStartDay, pStartHour, pStartMin);
const stopDate = new Date(pStopYear, pStopMonth, pStopDay, pStopHour, pStopMin);

const dayStart = selectedDateTimestamp;
const dayEnd = selectedDateTimestamp + 24 * 60 * 60 * 1000;

// Calcular offset en minutos desde las 00:00 del día seleccionado
let startMinutes = (startDate.getTime() - dayStart) / (1000 * 60);
let stopMinutes = (stopDate.getTime() - dayStart) / (1000 * 60);

// Recortar si el programa empieza antes de las 00:00 de este día o termina después de las 24:00
if (startMinutes < 0) startMinutes = 0;
if (stopMinutes > 1440) stopMinutes = 1440;

let duration = stopMinutes - startMinutes;
duration = Math.max(15, duration); // Mínimo visual de 15 minutos

const div = document.createElement("div");
div.className = "program";
div.style.left = (startMinutes * PIXELS_PER_MINUTE) + "px";
div.style.width = (duration * PIXELS_PER_MINUTE) + "px";
div.textContent = p.title;

div.onclick = () => {
document.getElementById("info").innerHTML =
"<h3>" + p.title + "</h3>" +
"<p><b>Inicio:</b> " + p.start + "</p>" +
"<p><b>Fin:</b> " + p.stop + "</p>" +
"<p>" + p.desc + "</p>";
};

area.appendChild(div);
});

row.appendChild(channelDiv);
row.appendChild(area);
grid.appendChild(row);
});

sincronizarScroll();
}

// ... (resto de funciones como sincronizarScroll, etc.)
</script>
